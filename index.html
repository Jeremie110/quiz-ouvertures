<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz des ouvertures – L'Isle-Adam Échecs</title>
<style>
:root{--ink:#14213d;--bg:#eef1f6;--card:#fff;--line:#d5dbe6;--acc:#2b59c3;--acc-soft:#e6ecfb;--good:#1b8a5a;--good-bg:#e3f5ec;--bad:#c0392b;--bad-bg:#fbe8e5;--b:min(69vw,352px,max(136px,calc(100vh - 430px)))}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf5;--bg:#10151f;--card:#1a2230;--line:#2f3a4f;--acc:#7da2ff;--acc-soft:#22304d;--good:#4cc790;--good-bg:#173528;--bad:#ff8a7a;--bad-bg:#3b1f1c}}
@supports (height:100dvh){:root{--b:min(69vw,352px,max(136px,calc(100dvh - 430px)))}}
@media (max-width:560px){:root{--b:min(69vw,352px,max(136px,calc(100vh - 570px)))}}
@supports (height:100dvh){@media (max-width:560px){:root{--b:min(69vw,352px,max(136px,calc(100dvh - 570px)))}}}
#fb{min-height:92px;margin-bottom:12px}
.fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:92px}
.fb.ph{border:2px dashed var(--line);opacity:.75}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 40px}
h1,h2,.q{font-family:Georgia,"Times New Roman",serif;font-weight:700}
h1{font-size:1.5rem;margin:6px 0 2px}
.sub{margin:0 0 18px;opacity:.75}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
label{display:block;font-weight:600;margin:16px 0 6px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600}
.dark .btn,.btn.alt{background:var(--acc-soft);color:var(--ink)}
.btn.alt{background:var(--acc-soft);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tag{display:inline-block;background:var(--acc-soft);padding:3px 12px;border-radius:8px;font-size:.8rem}
.boardwrap{display:flex;justify-content:center;margin:14px 0}
.board{width:var(--b);height:var(--b);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:3px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sq.l{background:#f0d9b5;color:#b58863}.sq.d{background:#b58863;color:#f0d9b5}
.sq small{position:absolute;font-size:calc(var(--b)/8*.19);font-weight:700;line-height:1;font-family:system-ui,sans-serif}
.sq .r{top:6%;right:6%}.sq .f{bottom:5%;left:6%}
.pc{display:block;width:100%;height:100%;fill:#fff;stroke:#000;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pc.k{fill:#000}.pc .d{fill:none}.pc.k .d{stroke:#ececec}.pc .e{fill:#000;stroke:#000}.pc.k .e{fill:#ececec;stroke:#ececec}
.mvq{font-family:"Segoe UI",system-ui,sans-serif;font-weight:500;margin-left:.4em;white-space:nowrap}
.q{font-size:1.4rem;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.opt:not(:disabled):hover{border-color:var(--acc);background:var(--acc-soft)}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--ink);font-weight:600}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{padding:14px 16px;border-radius:14px}
.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}
.fb b{display:block;margin-bottom:2px}
.mv{font-family:Consolas,monospace;font-size:.95rem}
.big{font-size:3rem;font-family:Georgia,serif;font-weight:700;margin:4px 0}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
ul.err{padding-left:18px;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Quiz des ouvertures</h1>
<p class="sub">L'Isle-Adam Échecs · après 1.d4 et 1.e4</p>
<div id="app"></div>
</main>
<script>
// ---------- Données : nom + coups (notation française) ----------
const O=[
["Gambit Dame accepté","1.d4 d5 2.c4 dxc4"],
["Gambit Dame refusé","1.d4 d5 2.c4 e6"],
["Défense slave","1.d4 d5 2.c4 c6"],
["Défense Tchigorine","1.d4 d5 2.c4 Cc6"],
["Contre-gambit Albin","1.d4 d5 2.c4 e5"],
["Système de Londres","1.d4 d5 2.Cf3 Cf6 3.Ff4"],
["Système Colle","1.d4 d5 2.Cf3 Cf6 3.e3"],
["Attaque Torre","1.d4 d5 2.Cf3 Cf6 3.Fg5"],
["Attaque Jobava","1.d4 d5 2.Cc3 Cf6 3.Ff4"],
["Défense Nimzo-indienne","1.d4 Cf6 2.c4 e6 3.Cc3 Fb4"],
["Défense ouest-indienne","1.d4 Cf6 2.c4 e6 3.Cf3 b6"],
["Défense Bogo-indienne","1.d4 Cf6 2.c4 e6 3.Cf3 Fb4+"],
["Partie catalane","1.d4 Cf6 2.c4 e6 3.g3"],
["Défense est-indienne","1.d4 Cf6 2.c4 g6 3.Cc3 Fg7"],
["Défense Grünfeld","1.d4 Cf6 2.c4 g6 3.Cc3 d5"],
["Défense Benoni","1.d4 Cf6 2.c4 c5"],
["Gambit de Budapest","1.d4 Cf6 2.c4 e5"],
["Attaque Trompowsky","1.d4 Cf6 2.Fg5"],
["Défense hollandaise","1.d4 f5"],
["Partie italienne","1.e4 e5 2.Cf3 Cc6 3.Fc4"],
["Partie espagnole","1.e4 e5 2.Cf3 Cc6 3.Fb5"],
["Partie écossaise","1.e4 e5 2.Cf3 Cc6 3.d4"],
["Partie des quatre Cavaliers","1.e4 e5 2.Cf3 Cc6 3.Cc3 Cf6"],
["Début Ponziani","1.e4 e5 2.Cf3 Cc6 3.c3"],
["Défense Petroff","1.e4 e5 2.Cf3 Cf6"],
["Défense Philidor","1.e4 e5 2.Cf3 d6"],
["Gambit éléphant","1.e4 e5 2.Cf3 d5"],
["Gambit letton","1.e4 e5 2.Cf3 f5"],
["Défense Damiano","1.e4 e5 2.Cf3 f6"],
["Partie viennoise","1.e4 e5 2.Cc3"],
["Partie du fou","1.e4 e5 2.Fc4"],
["Gambit du roi","1.e4 e5 2.f4"],
["Partie du centre","1.e4 e5 2.d4"],
["Défense sicilienne","1.e4 c5"],
["Défense française","1.e4 e6"],
["Défense Caro-Kann","1.e4 c6"],
["Défense scandinave","1.e4 d5"],
["Défense Pirc","1.e4 d6"],
["Défense moderne","1.e4 g6"],
["Défense Alekhine","1.e4 Cf6"],
["Défense Nimzowitsch","1.e4 Cc6"]
].map(([n,m])=>({n,m,g:m.slice(2,4)}));

// ---------- Mini-moteur : rejoue les coups sur l'échiquier ----------
const F="abcdefgh";
function position(str){
  const b={},back="RNBQKBNR";
  for(let i=0;i<8;i++){b[F[i]+1]=back[i];b[F[i]+2]="P";b[F[i]+7]="p";b[F[i]+8]=back[i].toLowerCase();}
  str.replace(/\d+\./g,"").trim().split(/\s+/).forEach((t,i)=>{
    const w=i%2===0,dir=w?1:-1;
    t=t.replace(/[+?!x]/g,"");
    const dest=t.slice(-2),df=F.indexOf(dest[0]),dr=+dest[1];
    const p=t.length>2&&"CFTDR".includes(t[0])?{C:"N",F:"B",T:"R",D:"Q",R:"K"}[t[0]]:"P";
    const want=w?p:p.toLowerCase();let from=null;
    if(p==="P"){
      const one=dest[0]+(dr-dir);
      from=t.length===3?t[0]+(dr-dir):(b[one]===want?one:dest[0]+(dr-2*dir));
    }else for(const sq in b){
      if(b[sq]!==want)continue;
      const dx=F.indexOf(sq[0])-df,dy=+sq[1]-dr,ax=Math.abs(dx),ay=Math.abs(dy);
      if(p==="N"&&ax*ay===2){from=sq;break;}
      if(p==="B"&&ax===ay&&ax>0){
        let ok=true;
        for(let k=1;k<ax;k++)if(b[F[df+Math.sign(dx)*k]+(dr+Math.sign(dy)*k)])ok=false;
        if(ok){from=sq;break;}
      }
    }
    if(!from||b[from]!==want)throw new Error("Coup impossible : "+t+" dans "+str);
    delete b[from];b[dest]=want;
  });
  return b;
}
const PC={
P:'<path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03C15.41 27.09 11 31.58 11 39.5H34c0-7.92-4.41-12.41-7.41-13.47C28.06 24.84 29 23.03 29 21c0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>',
N:'<path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/><path class="e" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0zM14.93 15.75a.5 1.5 30 1 1-.86-.5.5 1.5 30 1 1 .86.5z"/>',
B:'<path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.94 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/><path class="d" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>',
R:'<path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5" stroke-linecap="butt"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17" stroke-linecap="butt"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path class="d" d="M11 14h23"/>',
Q:'<path d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><circle cx="6" cy="12" r="2"/><circle cx="14" cy="9" r="2"/><circle cx="22.5" cy="8" r="2"/><circle cx="31" cy="9" r="2"/><circle cx="39" cy="12" r="2"/><path class="d" d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/>',
K:'<path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" stroke-linecap="butt"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z"/><path class="d" d="M22.5 11.63V6M20 8h5"/><path class="d" d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>'
};
function boardHTML(b){
  let h='<div class="board" role="img" aria-label="Position sur l\'échiquier">';
  for(let r=8;r>=1;r--)for(let f=0;f<8;f++){
    const sq=F[f]+r,p=b[sq];
    h+=`<div class="sq ${(f+r)%2?"d":"l"}">`+(f===7?`<small class="r">${r}</small>`:"")+(r===1?`<small class="f">${F[f]}</small>`:"")+
    (p?`<svg class="pc ${p===p.toUpperCase()?"w":"k"}" viewBox="0 0 45 45">${PC[p.toUpperCase()]}</svg>`:"")+"</div>";
  }
  return h+"</div>";
}

// ---------- Utilitaires ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY="quiz-ouvertures-historique";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=h=>{try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}};
const toks=m=>m.replace(/\d+\./g,"").trim().split(/\s+/);
function common(a,b){const x=toks(a),y=toks(b);let i=0;while(i<x.length&&i<y.length&&x[i]===y[i])i++;return i;}

let S={name:"",count:"10",group:"all",level:"easy"},Q=[],i=0,score=0,errs=[],done=false;

// ---------- Écran d'accueil ----------
function home(){
  const hist=load();
  $("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">Testez vos connaissances</h2>
  <p>Une position, quatre réponses : une seule est la bonne. Chaque bonne réponse vaut 1 point.</p>
  <label for="nom">Prénom du joueur</label><input id="nom" maxlength="30" placeholder="Prénom" value="${esc(S.name)}">
  <label for="grp">Ouvertures</label><select id="grp"><option value="all">Toutes (1.d4 et 1.e4)</option><option value="d4">Seulement 1.d4</option><option value="e4">Seulement 1.e4</option></select>
  <label for="cnt">Nombre de questions</label><select id="cnt"><option>5</option><option>10</option><option>20</option><option value="all">Toutes</option></select>
  <label for="lvl">Niveau</label><select id="lvl"><option value="easy">Facile : mauvaises réponses variées</option><option value="hard">Difficile : mauvaises réponses proches</option></select>
  <div class="row"><button class="btn" id="go">Commencer</button></div></div>`+histHTML(hist);
  $("#grp").value=S.group;$("#cnt").value=S.count;$("#lvl").value=S.level;
  $("#go").onclick=()=>{S={name:$("#nom").value.trim(),count:$("#cnt").value,group:$("#grp").value,level:$("#lvl").value};start();};
  const c=$("#clr");if(c)c.onclick=()=>{if(confirm("Effacer tout l'historique des tentatives ?")){save([]);home();}};
}
function histHTML(h){
  if(!h.length)return"";
  return `<div class="card" style="margin-top:14px"><h2 style="margin:0">Dernières tentatives</h2><div style="overflow-x:auto"><table><tr><th>Date</th><th>Joueur</th><th>Score</th><th>Réglages</th></tr>`+
  h.slice(-10).reverse().map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.n||"–")}</td><td><b>${x.s}/${x.t}</b></td><td>${esc(x.r)}</td></tr>`).join("")+
  `</table></div><div class="row"><button class="btn alt" id="clr">Effacer l'historique</button></div></div>`;
}

// ---------- Quiz ----------
function start(){
  let pool=O.filter(o=>S.group==="all"||o.g===S.group);
  pool=shuffle(pool);
  if(S.count!=="all")pool=pool.slice(0,+S.count);
  Q=pool;i=0;score=0;errs=[];question();
}
function choices(o){
  const others=O.filter(x=>x!==o);
  let pick;
  if(S.level==="hard")pick=others.map(x=>({x,k:common(o.m,x.m)+Math.random()*.9})).sort((a,b)=>b.k-a.k).slice(0,3).map(e=>e.x);
  else pick=shuffle(others).slice(0,3);
  return shuffle([o,...pick]);
}
function question(){
  const o=Q[i],ch=choices(o);done=false;
  $("#app").innerHTML=`<div class="top"><span>Question ${i+1} / ${Q.length}</span><span>Score : <span id="sc">${score}</span></span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <div id="fb"><div class="fb ph">Choisis une réponse ci-dessous.</div></div>
  <div class="card"><span class="tag">Ouvertures principales</span>
  <div class="boardwrap">${boardHTML(position(o.m))}</div>
  <div class="q">Quelle est cette ouverture ? <span class="mvq">${esc(o.m)}</span></div></div>
  <div class="opts" style="margin-top:12px">${ch.map((c,k)=>`<button class="opt" data-k="${k}">${esc(c.n)}</button>`).join("")}</div>`;
  window.scrollTo(0,0);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,ch,o));
}
function answer(btn,ch,o){
  if(done)return;done=true;
  const ok=ch[+btn.dataset.k]===o;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(ch[+b.dataset.k]===o)b.classList.add("good");});
  if(ok)score++;else{btn.classList.add("bad");errs.push(o);}
  $("#sc").textContent=score;
  const last=i===Q.length-1;
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><div><b>${ok?"Bravo, +1 point !":"Raté, la bonne réponse est :"}</b>${esc(o.n)}</div><button class="btn" id="nx">${last?"Voir le résultat":"Question suivante"}</button></div>`;
  $("#nx").focus({preventScroll:true});
  $("#nx").onclick=()=>{if(last)result();else{i++;question();}};
}
function result(){
  const t=Q.length,p=score/t;
  const msg=p===1?"Parfait, aucune erreur !":p>=.7?"Très bien joué !":p>=.4?"Bon début, on retravaille les erreurs.":"Pas de souci, on recommence pour progresser.";
  const h=load();
  h.push({d:new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),n:S.name,s:score,t,
    r:(S.group==="all"?"d4+e4":"1."+S.group)+", "+(S.level==="easy"?"facile":"difficile")});
  save(h);
  $("#app").innerHTML=`<div class="card" style="text-align:center"><h2 style="margin:0">${S.name?esc(S.name)+", ton":"Ton"} résultat</h2>
  <div class="big">${score} / ${t}</div><p>${msg}</p></div>`+
  (errs.length?`<div class="card" style="margin-top:14px"><h2 style="margin:0">À revoir</h2><ul class="err">${errs.map(o=>`<li><b>${esc(o.n)}</b> : <span class="mv">${esc(o.m)}</span></li>`).join("")}</ul></div>`:"")+
  `<div class="row"><button class="btn" id="again">Rejouer</button><button class="btn alt" id="menu">Changer les réglages</button></div>`+histHTML(h);
  $("#again").onclick=start;$("#menu").onclick=home;
  const c=$("#clr");if(c)c.onclick=()=>{if(confirm("Effacer tout l'historique des tentatives ?")){save([]);result();}};
}
home();
</script>
</body>
</html>
